name: BEAST FPS LAB iOS Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Show Swift Version
        run: |
          swift --version
          xcodebuild -version

      - name: Show Project Structure
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          find . -maxdepth 3 -type f | sort

      - name: Check Swift Package
        run: |
          if [ ! -f "Package.swift" ]; then
            echo "ERROR: Package.swift not found."
            echo "This repository needs an Xcode project or Swift Package manifest."
            exit 1
          fi

      - name: Build Swift Package
        run: |
          swift build

      - name: Build Result
        if: success()
        run: |
          echo "================================="
          echo "BEAST FPS LAB BUILD SUCCESSFUL"
          echo "================================="